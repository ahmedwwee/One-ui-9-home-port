<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16294d"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5cff"/>
      <stop offset="1" stop-color="#8a3dff"/>
    </linearGradient>
    <clipPath id="screen"><rect x="858" y="70" width="270" height="500" rx="34"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1020" cy="320" r="300" fill="#4f8cff" opacity="0.10"/>
  <circle cx="160" cy="600" r="220" fill="#7c5cff" opacity="0.10"/>

  <!-- Text -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="80" y="120" width="150" height="38" rx="19" fill="url(#acc)"/>
    <text x="155" y="146" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">PORT • APK</text>

    <text x="80" y="260" font-size="84" font-weight="800" fill="#ffffff">One UI Home</text>
    <text x="80" y="330" font-size="40" font-weight="500" fill="#b8c7ea">Launcher Port for any Android</text>

    <g font-size="24" fill="#d5e0fa">
      <circle cx="92" cy="395" r="7" fill="#4f8cff"/><text x="116" y="403">Non-Samsung devices</text>
      <circle cx="92" cy="440" r="7" fill="#4f8cff"/><text x="116" y="448">Clean One UI look &amp; feel</text>
      <circle cx="92" cy="485" r="7" fill="#4f8cff"/><text x="116" y="493">Free download on Telegram</text>
    </g>

    <rect x="80" y="535" width="420" height="54" rx="27" fill="none" stroke="#4f8cff" stroke-width="2.5"/>
    <text x="290" y="570" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Samsung Apps Port · @samapport</text>
  </g>

  <!-- Phone mockup -->
  <rect x="846" y="58" width="294" height="524" rx="46" fill="#05080f" stroke="#33477a" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="858" y="70" width="270" height="500" fill="url(#wall)"/>
    <circle cx="1060" cy="150" r="120" fill="#fff" opacity="0.08"/>
    <!-- clock widget -->
    <g font-family="Segoe UI, Roboto, Arial, sans-serif" fill="#fff">
      <text x="993" y="160" font-size="56" font-weight="300" text-anchor="middle">9:41</text>
      <text x="993" y="188" font-size="15" opacity="0.85" text-anchor="middle">Wednesday, 18 November</text>
    </g>
    <!-- icon grid -->
    <g>
      <rect x="884" y="235" width="50" height="50" rx="16" fill="#ff5d6c"/>
      <rect x="954" y="235" width="50" height="50" rx="16" fill="#ffb347"/>
      <rect x="1024" y="235" width="50" height="50" rx="16" fill="#4cd964"/>
      <rect x="1094" y="235" width="0" height="0"/>
      <rect x="884" y="315" width="50" height="50" rx="16" fill="#35c2ff"/>
      <rect x="954" y="315" width="50" height="50" rx="16" fill="#b46bff"/>
      <rect x="1024" y="315" width="50" height="50" rx="16" fill="#ff7ad9"/>
      <rect x="884" y="395" width="50" height="50" rx="16" fill="#ffd84d"/>
      <rect x="954" y="395" width="50" height="50" rx="16" fill="#5ee0c1"/>
      <rect x="1024" y="395" width="50" height="50" rx="16" fill="#6d8bff"/>
    </g>
    <!-- dock -->
    <rect x="874" y="490" width="230" height="64" rx="28" fill="#fff" opacity="0.22"/>
    <rect x="890" y="502" width="40" height="40" rx="13" fill="#fff" opacity="0.9"/>
    <rect x="945" y="502" width="40" height="40" rx="13" fill="#fff" opacity="0.9"/>
    <rect x="1000" y="502" width="40" height="40" rx="13" fill="#fff" opacity="0.9"/>
    <rect x="1055" y="502" width="40" height="40" rx="13" fill="#fff" opacity="0.9"/>
  </g>
  <rect x="965" y="78" width="56" height="12" rx="6" fill="#05080f"/>

  <text x="1200" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6f84b3" text-anchor="end">Unofficial port · Not affiliated with Samsung</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
